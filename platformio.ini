; ================================================================
;  FridgeCTL — native ESP-IDF firmware (migrated from ESPHome)
;  Board: LilyGo T-Relay (ESP32) / esp32dev
; ================================================================
[env:fridgectl]
; Pinned to the exact pioarduino release this firmware is verified on
; (ESP-IDF 5.5.4). A bare `espressif32` resolves to whatever espressif32 is
; installed, and a silent IDF bump once dropped the OTA-rollback setting.
; This release needs PlatformIO Core 6.1.x: 6.2.0 (pulled in by ESPHome
; 2026.10) forces SCons 4.11, which breaks its build scripts at link time.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB

; Serial upload by default. After first flash you can also update
; over the network via the built-in HTTP OTA endpoint (see ota.cpp /
; README). To flash a specific port:  pio run -t upload --upload-port COMx
;
; Managed IDF components (onewire_bus, ds18b20) are declared in
; src/idf_component.yml and fetched automatically on first build.
